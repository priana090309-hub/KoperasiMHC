<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Masuk ke koperasi di gital smk muthia</title>

<link rel="stylesheet" href="yan.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head><body><main class="auth-container">

    <section class="auth-card">

        <div class="brand">
            <img src="logo.jpg" alt="" width="50">
            <div class=""></div>
            <span>koperasi digital</span>
        </div>

        <div class="auth-header">
            <h1>Selamat Datang di koperasi digital smk muthia</h1>
            <p>smk muthia harapan cicalengka.</p>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="input-group">
                <label for="loginUsername">Username</label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Masukkan username"
                    required
                >
            </div>

            <div class="input-group">

                <label for="loginPassword">Kata Sandi</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Masukkan kata sandi"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button type="submit" class="btn-primary">
                Masuk
                <span>→</span>
            </button>

        </form>

        <div class="divider">
            <span>ATAU</span>
        </div>

        <p class="auth-footer">
            Belum memiliki akun?
            <a href="register.html">Daftar sekarang</a>
        </p>

    </section>

</main>

<script>

const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");


loginForm.addEventListener("submit", function(e) {

    e.preventDefault();

    const username =
        document.getElementById("loginUsername")
        .value
        .trim();

    const password =
        document.getElementById("loginPassword")
        .value;


    // Ambil data akun dari localStorage

    const userData =
        JSON.parse(localStorage.getItem("userAccount"));


    // Jika belum ada akun

    if (!userData) {

        showMessage(
            "Anda belum memiliki akun. Silakan daftar terlebih dahulu."
        );

        return;

    }


    // Verifikasi login

    if (
        username === userData.username &&
        password === userData.password
    ) {

        // Simpan status login

        sessionStorage.setItem(
            "isLoggedIn",
            "true"
        );


        // Simpan username

        sessionStorage.setItem(
            "username",
            username
        );


        // Redirect ke halaman kamu

        window.location.href = "koperasi.html";

    }

    else {

        showMessage(
            "Username atau kata sandi salah!"
        );

    }

});


function showMessage(text) {

    message.innerText = text;

    message.classList.add("show");

}


function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);


    if (input.type === "password") {

        input.type = "text";

        button.innerText = "🙈";

    }

    else {

        input.type = "password";

        button.innerText = "👁";

    }

}

</script></body>
</html>
